<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Server Hub</title>
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmMBcsVCECqAWRPJTfpuH6JLHJI3" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> -->
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #030032;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cbox {
      background-color: #c8c7c7b5;
      color: black;
      padding: 40px;
      border-radius: 10px;
      width: 550px;
      text-align: center;
    }

    .cbox h2 {
      margin-bottom: 30px;
      font-size: 28px;
    }

    .cc {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      gap: 10px;
    }

    .cc label {
      font-size: 16px;
      white-space: nowrap;
    }

    .cc input {
      width: 160px;
      padding: 5px;
      border: none;
      border-radius: 5px;
    }

    .cbutton {
      background-color: #212faa;
      color: white;
      border: none;
      padding: 8px 25px;
      border-radius: 5px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .cbutton:hover {
      background-color: #3d20bf;
    }

  </style>
</head>

<body>

  <div class="cbox">
    <h2>Server Hub</h2>

    <div class="cc">
      <label>How many people do you need?</label>
      <input type="number" id="peopleCount" min="0">
    </div>

 <!-- This one doesnt do anything yet the other button is suposed to send to whiteboard -->
    <button class="cbutton">Submit</button>

    <br>
    
    <div class="cc">
      <label>Join Server code:</label>
      <input type="text" id="serverCode">
    </div>

    <a href="../whiteboard.html"><button class="cbutton">Join</button></a>

  </div>

</body>
</html>
